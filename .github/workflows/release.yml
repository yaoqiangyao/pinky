name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

# A tag v<version>, which `scripts/release.sh tag` pushes with its commit,
# is a release: this builds Pinky for Windows (on Ubuntu, with the FFmpeg
# and adb that scripts/ffmpeg.sh and scripts/adb.sh build in containers),
# checks on GitHub's Windows runner that the package's FFmpeg decodes and
# its adb runs a server, then publishes the GitHub release, latest.json
# last. This fork ships Windows only and for iPhones only: no companion
# APK, no macOS or Linux packages, no Homebrew cask. The steps are the
# scripts at the tag: scripts/dist.sh builds, scripts/publish.sh
# publishes. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release again (v2026.1107.1)
        required: true
      publish:
        description: Publish it (off builds the branch this runs on, as the tag's version, and keeps the files as this run's artifacts)
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  TAG: ${{ inputs.tag || github.ref_name }}
  # What the jobs build: the tag, or, in a run by hand that publishes
  # nothing, the commit it runs on, to try a branch as a release.
  REF: ${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && github.sha || format('refs/tags/{0}', inputs.tag || github.ref_name) }}

jobs:
  linux-windows:
    name: Windows build
    # The fork's build machine, debian-lan (192.168.89.130): a self-hosted
    # runner with Docker and NSIS that keeps FFmpeg's and adb's builds in
    # ~/.cache/pinky-release between releases, so only the first build
    # makes them (about 15 minutes). Only this workflow, which runs for tags
    # and by hand, may use it: never pull requests.
    runs-on: [self-hosted, linux, x64, pinky-build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the build machine's tools
        run: |
          for c in docker makensis zip unzip; do
            command -v "$c" >/dev/null || { echo "::error::$c is missing on the build machine"; exit 1; }
          done
          docker info --format 'Docker {{.ServerVersion}}'
          mkdir -p "$HOME/.cache/pinky-release/ffmpeg" "$HOME/.cache/pinky-release/adb"
          echo "FFMPEG_CACHE=$HOME/.cache/pinky-release/ffmpeg" >> "$GITHUB_ENV"
          echo "ADB_CACHE=$HOME/.cache/pinky-release/adb" >> "$GITHUB_ENV"
      - name: Build
        env:
          STRICT: "1"
          PINKY_NO_COMPANION: "1"
          GH_TOKEN: ${{ github.token }} # scripts/adb.sh, when github.com's release downloads fail
        run: |
          go run ./scripts/release stamp "${TAG#v}"
          scripts/dist.sh windows "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows package
    needs: linux-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: linux-windows
          path: ${{ runner.temp }}/dist
      - name: Download an ffmpeg command for the test streams
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A static build, so that no other FFmpeg DLLs are around. Through
          # GitHub's API (gh), as in ci.yml, since the releases' download
          # links have answered 504 for hours at a time.
          for try in 1 2 3; do
            gh release download latest --repo FFmpeg-Builds/FFmpeg-Builds --pattern ffmpeg-n9.0-latest-win64-gpl-9.0.zip --dir "$RUNNER_TEMP" --clobber && exit 0
            sleep 30
          done
          exit 1
      - name: Unpack the Windows zip and the ffmpeg command
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $version = $env:TAG.TrimStart('v')
          Expand-Archive "$env:RUNNER_TEMP\dist\pinky-$version-windows-amd64.zip" -DestinationPath "$env:RUNNER_TEMP\windows-package"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg-n9.0-latest-win64-gpl-9.0.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName + "\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Get-ChildItem "$env:RUNNER_TEMP\windows-package"
      - name: Check that the Windows package's FFmpeg decodes
        shell: bash
        run: |
          PINKY_FFMPEG_APP="$RUNNER_TEMP\windows-package" go test -count=1 -run TestPackagedFFmpeg -v ./internal/video/ | grep -E -e '--- |^(ok|FAIL)|video_test.go'
      - name: Check that the Windows package's adb runs a server
        shell: bash
        run: |
          PINKY_ADB_APP="$RUNNER_TEMP\windows-package" go test -count=1 -run TestPackagedADB -v ./internal/driver/android/adb/ | grep -E -e '--- |^(ok|FAIL)|packaged_test.go'

  publish:
    name: Publish
    needs: [linux-windows, windows]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: linux-windows
          path: ${{ runner.temp }}/dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_REPO: ${{ github.repository }}
        run: |
          go run ./scripts/release mcpb -version "${TAG#v}" -out "$RUNNER_TEMP/dist/pinky-${TAG#v}.mcpb"
          go run ./scripts/release manifest -dir "$RUNNER_TEMP/dist" -version "${TAG#v}" -repo "$RELEASES_REPO" -partial
          ls -l "$RUNNER_TEMP/dist"
          scripts/publish.sh "$RUNNER_TEMP/dist"
